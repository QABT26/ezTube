name: Diagnose KAPT

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-kapt.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback-owner-v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Diagnose kapt
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --refresh-dependencies :app:kaptDebugKotlin --stacktrace --info
