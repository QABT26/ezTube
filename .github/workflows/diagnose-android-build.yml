name: Diagnose Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-android-build.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playback-owner-v7
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Diagnose kapt/build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --refresh-dependencies testDebugUnitTest assembleDebug --stacktrace --info 2>&1 | tee build-diagnose.log

      - name: Upload diagnose log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnose
          path: build-diagnose.log
