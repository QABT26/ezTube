name: Vendor PipePipeExtractor Java 17

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vendor-pipepipe-java17.yml"

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ezTube
        uses: actions/checkout@v4
        with:
          ref: playback-owner-v7
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build PipePipeExtractor v5.4.0 for Java 17
        shell: bash
        run: |
          set -Eeuo pipefail

          SHA="c68e10e2e97495877832d8df6cbac55478083019"
          WORK="$RUNNER_TEMP/PipePipeExtractor"
          rm -rf "$WORK"

          git clone https://github.com/InfinityLoop1308/PipePipeExtractor.git "$WORK"
          cd "$WORK"
          git checkout "$SHA"

          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle")
          text = root.read_text()
          text = text.replace(
              "languageVersion = JavaLanguageVersion.of(25)",
              "languageVersion = JavaLanguageVersion.of(17)",
          )
          root.write_text(text)

          extractor = Path("extractor/build.gradle")
          text = extractor.read_text()
          text = text.replace(
              'implementation "com.squareup.okhttp3:okhttp:5.4.0"',
              'implementation "com.squareup.okhttp3:okhttp:4.12.0"',
          )
          extractor.write_text(text)
          PY

          ./gradlew --no-daemon clean publishToMavenLocal

          cd "$GITHUB_WORKSPACE"
          rm -rf local-maven/com/github/InfinityLoop1308/PipePipeExtractor
          mkdir -p local-maven/com/github/InfinityLoop1308
          cp -a "$HOME/.m2/repository/com/github/InfinityLoop1308/PipePipeExtractor"             local-maven/com/github/InfinityLoop1308/

          find local-maven/com/github/InfinityLoop1308/PipePipeExtractor -type f             \( -name "*.lastUpdated" -o -name "maven-metadata-local.xml*" \) -delete

      - name: Commit vendored Java 17 artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-maven
          if git diff --cached --quiet; then
            echo "No vendor changes"
            exit 0
          fi
          git commit -m "build: vendor PipePipeExtractor v5.4.0 Java 17 [skip ci]"
          git push origin HEAD:playback-owner-v7
